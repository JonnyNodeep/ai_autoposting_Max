[tool.poetry]
name = "ai-content-studio"
version = "0.1.0"
description = "AI Content Studio for MAX — SaaS-платформа автоматизации контента для каналов MAX"
authors = ["AI Content Studio Team"]
readme = "SPEC.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
httpx = "^0.27"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
alembic = "^1.13"
redis = "^5.0"
pydantic-settings = "^2.6"
loguru = "^0.7"
openai = "^1.57"
python-dotenv = "^1.0"
apscheduler = "^3.10"
tenacity = "^9.0"
arq = "^0.27"
yookassa = "^3.0"
psycopg2-binary = "^2.9.12"
pillow = "^10.4"
feedparser = "^6.0"
jinja2 = "^3.1"
python-multipart = "^0.0.9"
itsdangerous = "^2.2"
google-api-python-client = "^2.150"
google-auth = "^2.35"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
httpx-sse = "^0.4"
aiosqlite = "^0.20"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
